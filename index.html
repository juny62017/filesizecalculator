<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>File Size Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-wrapper">

    <header>
        <h1>File Size Converter</h1>
        <p>Convert between KB, MB and GB</p>
    </header>

    <section class="converter-area">

        <div class="field">
            <label>Enter Value</label>
            <input type="number" id="sizeInput" placeholder="Enter number">
        </div>

        <div class="field">
            <label>Select Unit</label>
            <select id="unitSelect">
                <option value="KB">KB</option>
                <option value="MB">MB</option>
                <option value="GB">GB</option>
            </select>
        </div>

        <div class="buttons">
            <button id="convertBtn">Convert</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div class="result-box">
            <div id="result">Output will show here</div>
        </div>

    </section>

</div>

<script src="script.js"></script>
</body>
</html>

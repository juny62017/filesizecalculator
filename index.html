<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Size Calculator</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>📁 File Size Calculator</h1>
    <p class="subtitle">
      Convert file sizes between KB, MB, and GB easily.
    </p>

    <section class="card">
      <h2>Enter File Size</h2>

      <label for="sizeInput">File size value</label>
      <input
        type="number"
        id="sizeInput"
        placeholder="e.g. 1024"
      />

      <label for="unitSelect">Select unit</label>
      <select id="unitSelect">
        <option value="KB">KB (Kilobytes)</option>
        <option value="MB">MB (Megabytes)</option>
        <option value="GB">GB (Gigabytes)</option>
      </select>

      <div class="buttons">
        <button id="convertBtn">Convert</button>
        <button id="clearBtn">Clear</button>
      </div>

      <div id="result" class="result">
        Result will appear here
      </div>
    </section>

    <footer>
      Built as a beginner-friendly project using HTML, CSS & JavaScript
    </footer>
  </div>

  <!-- JS -->
  <script src="script.js" defer></script>
</body>
</html>

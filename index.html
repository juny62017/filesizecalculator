<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>File Size Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main">

    <h1>File Size Converter</h1>
    <p class="subtitle">Convert file sizes between KB, MB and GB</p>

    <div class="card">

        <div class="input-section">
            <label for="sizeInput">Enter file size</label>
            <input type="number" id="sizeInput" placeholder="Enter value">
        </div>

        <div class="input-section">
            <label for="unitSelect">Select unit</label>
            <select id="unitSelect">
                <option value="KB">KB</option>
                <option value="MB">MB</option>
                <option value="GB">GB</option>
            </select>
        </div>

        <div class="button-section">
            <button id="convertBtn">Convert</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div class="output-section">
            <div id="result">Output will show here</div>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
